name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm exec tsc --noEmit

    # No bloqueante mientras exista la deuda previa (~90 errores, sobre todo no-explicit-any).
    # Quitar continue-on-error cuando el lint esté limpio.
    - name: Lint
      run: pnpm run lint
      continue-on-error: true

    - name: Build Next.js App
      run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ruff==0.17.3

    # Solo errores reales (sintaxis, nombres indefinidos), no estilo.
    - name: Lint
      run: ruff check --select E9,F63,F7,F82 .

    - name: Tests
      run: python -m pytest -q
