services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - DB_PATH=/app/data/finance_portfolio.db
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  # Optional: run Ollama in its own container instead of on the host.
  # Uncomment, then set OLLAMA_URL=http://ollama:11434 above, and run
  # `docker compose exec ollama ollama pull llama3.1` once after startup.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  backend_data:
  # ollama_data:
